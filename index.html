<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONFESS — Beta 1.4</title>
<style>
:root{--bg:#0b0c11;--surface:#14161f;--surface2:#191b26;--text:#f4f3f7;--muted:#9194a3;--line:#2a2d39;--accent:#9b6cf0;--accent2:#ed86b8;--danger:#ff7187}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -12%,#292044 0,#0b0c11 40%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,textarea{font:inherit}button{cursor:pointer}
.app{width:min(100%,480px);margin:auto;min-height:100vh;background:rgba(11,12,17,.96);position:relative;padding-bottom:82px}
.top{position:sticky;top:0;z-index:5;background:rgba(11,12,17,.91);backdrop-filter:blur(18px);padding:16px 18px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.header-row{height:42px;display:flex;align-items:center;justify-content:center;position:relative}
.brand{font-size:23px;font-weight:780;letter-spacing:-.8px}.brand span{color:var(--accent2)}
.info-btn{position:absolute;right:0;width:38px;height:38px;border:1px solid var(--line);background:#11131a;color:#c9cad4;border-radius:10px}
.tabs{display:flex;gap:28px;margin-top:12px;overflow:auto}
.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 0 11px;white-space:nowrap}
.tab.active{color:#fff;border-bottom-color:var(--accent2)}
.screen{padding:18px 17px}
.compose{background:#14161f;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:18px}
.compose-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.compose-title{font-size:15px;color:#d9d9e1}
.compose-btn{border:1px solid #413854;background:#1a1824;color:#eee7fa;border-radius:10px;padding:9px 11px;font-size:12px}
.compose-btn:active{background:#24202f}
.post{background:linear-gradient(145deg,var(--surface),#11131b);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:16px}
.post:last-child{margin-bottom:0}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}
.tag{color:#d6b8ff}.post p{font-size:16px;line-height:1.52;margin:12px 0 15px}
.actions{display:flex;align-items:center;gap:5px;border-top:1px solid rgba(255,255,255,.045);padding-top:11px}
.action{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:9px;padding:6px 8px;font-size:12px}
.action:hover{border-color:var(--line)}
.action.together{border-color:#343643;color:#c5c6d0}.action.together.active{border-color:#9b6cf0;background:#211a32;color:#fff}
.action.liked{color:var(--danger)}
.share{margin-left:1px}.anon{margin-left:auto;color:#858895;font-size:10px}
.inspiration{overflow:hidden;border:1px solid #343043;border-radius:15px;background:#15141e;margin-bottom:16px}
.inspo-image{height:145px;background:
linear-gradient(160deg,rgba(20,20,30,.05),rgba(8,9,14,.7)),
radial-gradient(circle at 75% 30%,rgba(255,194,211,.7),transparent 18%),
linear-gradient(145deg,#514d64 0%,#25243a 42%,#101219 100%);position:relative}
.inspo-image:after{content:"";position:absolute;left:0;right:0;bottom:0;height:65%;background:linear-gradient(transparent,rgba(7,8,12,.78))}
.inspo-text{padding:13px 15px 15px}.inspo-text strong{display:block;font-size:14px;line-height:1.4}.inspo-text span{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.section-title{margin:20px 2px 10px;font-size:13px;color:#d5d6de;font-weight:650}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.topic{border:1px solid var(--line);background:#12141b;color:#d6d7df;border-radius:11px;padding:14px;text-align:left}.topic small{display:block;color:var(--muted);margin-top:5px}
.empty{padding:42px 20px;text-align:center;color:var(--muted)}.empty h2{color:var(--text);margin:0 0 8px;font-size:18px}
.fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:54px;height:54px;border:0;border-radius:12px;background:#996bef;color:#fff;font-size:28px;box-shadow:0 9px 25px rgba(130,90,220,.28);z-index:8}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:66px;background:rgba(15,16,23,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:7}
.nav{border:0;background:none;color:var(--muted);font-size:10px;min-width:62px;padding-top:8px}.nav.active{color:#fff}.nav b{display:block;font-size:18px;margin-bottom:2px;font-weight:500}
.profile-card{background:#14161f;border:1px solid var(--line);border-radius:15px;padding:18px}
.profile-head{display:flex;align-items:center;gap:13px}.avatar{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,#8b62ec,#ef88bb);display:grid;place-items:center;font-size:24px}.profile-head h2{margin:0;font-size:18px}.profile-id{color:var(--muted);font-size:11px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#101219;border:1px solid var(--line);border-radius:10px;padding:11px 7px;text-align:center}.stat strong{display:block;font-size:18px}.stat span{color:var(--muted);font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}
.sheet{width:min(100%,480px);margin:auto;background:#141620;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:19px;max-height:92vh;overflow:auto}
.handle{width:42px;height:4px;border-radius:4px;background:#444754;margin:0 auto 17px}.sheet h2{margin:0 0 4px;font-size:21px}.modal-sub{color:var(--muted);font-size:11px}
.textarea{width:100%;min-height:165px;resize:vertical;background:#0e1017;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none;margin:14px 0}.textarea:focus{border-color:#7655ad}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 15px}.chip{border:1px solid var(--line);background:#11131b;color:#b8bac8;border-radius:8px;padding:8px 10px;font-size:12px}.chip.sel{border-color:#9a6cf0;color:#fff;background:#251d38}
.primary{border:0;border-radius:10px;background:#996bef;color:#fff;padding:12px 15px;font-weight:700;width:100%}.secondary{border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);padding:11px 15px;width:100%;margin-top:9px}
.notice{font-size:11px;color:#9fa2b2;background:#10121a;border:1px solid var(--line);padding:10px;border-radius:10px;margin-bottom:12px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,18px);opacity:0;background:#f4f3f7;color:#15151c;padding:10px 14px;border-radius:10px;font-size:12px;z-index:30;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){body{padding:20px 0}.app{border-radius:25px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.35)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="header-row"><div class="brand">confess<span>.</span></div><button class="info-btn" id="infoBtn">i</button></div>
  <div class="tabs">
    <button class="tab active" data-filter="popular">Популярное</button>
    <button class="tab" data-filter="new">Свежее</button>
    <button class="tab" data-filter="mine">Мои</button>
  </div>
</header>
<main class="screen" id="screen"></main>
<button class="fab" id="fab">+</button>
<nav class="bottom">
  <button class="nav active" data-nav="feed"><b>⌂</b>Лента</button>
  <button class="nav" data-nav="topics"><b>◌</b>Темы</button>
  <button class="nav" data-nav="answers"><b>♡</b>Ответы</button>
  <button class="nav" data-nav="profile"><b>◯</b>Профиль</button>
</nav>
</div>

<div class="modal" id="modal"><div class="sheet">
<div class="handle"></div><h2>Новое признание</h2><div class="modal-sub">анонимно</div>
<textarea class="textarea" id="text" maxlength="1000" placeholder="Что хочешь сказать?"></textarea>
<div class="section-title">Тема</div><div class="chips" id="topics"></div>
<div class="notice">Перед публикацией текст проверяется на спам, угрозы, персональные данные и другой опасный контент.</div>
<button class="primary" id="publish">Опубликовать</button><button class="secondary" id="close">Отмена</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const now=Date.now();
const seed=[
{id:1,tag:'Отношения',createdAt:now-2*3600000,text:'Я до сих пор иногда захожу на его страницу. Хотя знаю, что не нужно.',likes:1240,together:1847,comments:423,mine:false},
{id:2,tag:'Работа',createdAt:now-4*3600000,text:'Я ненавижу свою работу, но боюсь признаться даже самому себе, что хочу всё поменять.',likes:891,together:1242,comments:206,mine:false},
{id:3,tag:'Жизнь',createdAt:now-5*3600000,text:'Улыбаюсь всем, но внутри очень устал(а). Кажется, никто этого не замечает.',likes:2400,together:3810,comments:317,mine:false},
{id:4,tag:'Деньги',createdAt:now-7*3600000,text:'Я говорю родителям, что всё нормально с деньгами. На самом деле я уже несколько месяцев живу от зарплаты до зарплаты.',likes:736,together:913,comments:189,mine:false},
{id:5,tag:'Друзья',createdAt:now-26*3600000,text:'Иногда мне хочется исчезнуть на неделю, выключить телефон и никому ничего не объяснять.',likes:1102,together:2140,comments:251,mine:false}
];
let posts=JSON.parse(localStorage.getItem('confess_posts_v14')||'null')||seed;
let likes=JSON.parse(localStorage.getItem('confess_likes_v14')||'[]');
let togethers=JSON.parse(localStorage.getItem('confess_together_v14')||'[]');
let filter='popular',nav='feed',selectedTopic='Жизнь';
const topics=['Отношения','Работа','Жизнь','Деньги','Психология','Семья','Друзья','Учёба','Другое'];
const screen=document.getElementById('screen'),modal=document.getElementById('modal'),text=document.getElementById('text'),toast=document.getElementById('toast');

function save(){localStorage.setItem('confess_posts_v14',JSON.stringify(posts));localStorage.setItem('confess_likes_v14',JSON.stringify(likes));localStorage.setItem('confess_together_v14',JSON.stringify(togethers))}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':n}
function relative(ts){let d=Math.max(0,Date.now()-ts),m=Math.floor(d/60000),h=Math.floor(m/60),day=Math.floor(h/24);if(m<1)return 'только что';if(m<60)return m+' '+word(m,'минуту','минуты','минут')+' назад';if(h<24)return h+' '+word(h,'час','часа','часов')+' назад';if(day===1)return 'вчера';return day+' '+word(day,'день','дня','дней')+' назад'}
function word(n,a,b,c){let x=n%100;if(x>=11&&x<=14)return c;switch(n%10){case 1:return a;case 2:case 3:case 4:return b;default:return c}}
function render(){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===nav));if(nav==='feed')feed();else if(nav==='topics')topicsPage();else if(nav==='answers')answers();else profile()}
function feed(){
 let list=[...posts];
 if(filter==='new')list.sort((a,b)=>b.createdAt-a.createdAt);
 if(filter==='popular')list.sort((a,b)=>(b.likes+b.together*.7+b.comments*.4)-(a.likes+a.together*.7+a.comments*.4));
 if(filter==='mine')list=list.filter(p=>p.mine).sort((a,b)=>b.createdAt-a.createdAt);
 let intro=`<div class="compose"><div class="compose-line"><span class="compose-title">Хочешь что-то сказать?</span><button class="compose-btn" onclick="openModal()">Написать</button></div></div>`;
 let cards=list.map((p,i)=>card(p)).join('');
 screen.innerHTML=intro+cards;
}
function card(p){
 let l=likes.includes(p.id),t=togethers.includes(p.id);
 return `<article class="post"><div class="meta"><span class="tag">${esc(p.tag)}</span><span>${relative(p.createdAt)}</span></div>
 <p>${esc(p.text)}</p><div class="actions">
 <button class="action ${l?'liked':''}" onclick="like(${p.id})">${l?'♥':'♡'} ${fmt(p.likes+(l?1:0))}</button>
 <button class="action together ${t?'active':''}" onclick="together(${p.id})">${t?'✓ Я тоже':'＋ Я тоже'} ${fmt(p.together+(t?1:0))}</button>
 <button class="action" onclick="toastMsg('Ответы скоро появятся')">◌ ${fmt(p.comments)}</button>
 <button class="action share" onclick="sharePost(${p.id})">↗</button><span class="anon">анонимно</span>
 </div></article>`;
}
function topicsPage(){screen.innerHTML=`<div class="section-title">Темы</div><div class="topic-grid">${topics.map((t,i)=>`<button class="topic" onclick="topicFeed('${t}')">${t}<small>${[12.4,9.8,18.2,7.1,11.3,6.4,8.2,4.9,5.7][i]}K историй</small></button>`).join('')}</div><div class="section-title">Популярное сейчас</div>${posts.slice(0,3).map(card).join('')}`}
function topicFeed(t){nav='feed';filter='popular';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter==='popular'));render();toastMsg('Тема: '+t)}
function answers(){screen.innerHTML=`<div class="section-title">Ответы</div><div class="empty"><h2>Пока пусто</h2><div>Когда появятся ответы на твои истории, они будут здесь.</div></div>`}
function profile(){
 const mine=posts.filter(p=>p.mine),reactions=mine.reduce((s,p)=>s+p.likes+p.together,0);
 screen.innerHTML=`<div class="profile-card"><div class="profile-head"><div class="avatar">🤫</div><div><h2>Аноним</h2><div class="profile-id">#${String(Math.abs(hashCode('anon'))).slice(0,6)}</div></div></div>
 <div class="stats"><div class="stat"><strong>${mine.length}</strong><span>историй</span></div><div class="stat"><strong>${fmt(reactions)}</strong><span>реакций</span></div><div class="stat"><strong>${mine.reduce((s,p)=>s+p.comments,0)}</strong><span>ответов</span></div></div></div>
 <div class="section-title">Мои истории</div>${mine.length?mine.sort((a,b)=>b.createdAt-a.createdAt).map(card).join(''):`<div class="empty"><h2>Здесь появятся твои истории</h2></div>`}`;
}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h}
function openModal(){modal.classList.add('open');setTimeout(()=>text.focus(),50)}
function closeModal(){modal.classList.remove('open');text.value=''}
function topicChips(){document.getElementById('topics').innerHTML=topics.map(t=>`<button class="chip ${t===selectedTopic?'sel':''}" onclick="selectTopic('${t}')">${t}</button>`).join('')}
function selectTopic(t){selectedTopic=t;topicChips()}
function publish(){
 let v=text.value.trim();if(v.length<5){toastMsg('Напиши хотя бы несколько слов');return}
 posts.unshift({id:Date.now(),tag:selectedTopic,createdAt:Date.now(),text:v,likes:0,together:0,comments:0,mine:true});
 save();closeModal();nav='feed';filter='new';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter==='new'));render();toastMsg('Опубликовано')
}
function like(id){let p=posts.find(x=>x.id===id);if(!p)return;if(likes.includes(id))likes=likes.filter(x=>x!==id);else likes.push(id);save();render()}
function together(id){let p=posts.find(x=>x.id===id);if(!p)return;if(togethers.includes(id))togethers=togethers.filter(x=>x!==id);else togethers.push(id);save();render()}
function sharePost(id){let p=posts.find(x=>x.id===id);if(navigator.share){navigator.share({title:'CONFESS',text:p.text}).catch(()=>{})}else toastMsg('Ссылка скопирована')}
function toastMsg(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.filter;nav='feed';render()}));
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{nav=n.dataset.nav;render()}));
document.getElementById('fab').addEventListener('click',openModal);document.getElementById('close').addEventListener('click',closeModal);document.getElementById('publish').addEventListener('click',publish);
document.getElementById('infoBtn').addEventListener('click',()=>toastMsg('CONFESS · анонимные истории'));
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
topicChips();render();setInterval(()=>{if(nav==='feed'||nav==='profile')render()},30000);
</script>
</body>
</html>
