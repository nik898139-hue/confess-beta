<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONFESS — Beta 1.3</title>
<style>
:root{
  --bg:#0b0c11;--surface:#14161f;--surface2:#191b26;--text:#f5f4f7;
  --muted:#9295a5;--line:#292c38;--accent:#a879ff;--accent2:#ef88bb;
  --ok:#71e3b3;--danger:#ff7186;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -15%,#2b2147 0,#0b0c11 42%);color:var(--text);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{width:min(100%,480px);margin:auto;min-height:100vh;background:rgba(11,12,17,.95);position:relative;padding-bottom:82px}
.top{position:sticky;top:0;z-index:5;background:rgba(11,12,17,.88);backdrop-filter:blur(18px);
padding:17px 18px 12px;border-bottom:1px solid rgba(255,255,255,.045)}
.header-row{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:23px;font-weight:750;letter-spacing:-.8px}.brand span{color:var(--accent2)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#11131a;color:#c8cad5;border-radius:10px}
.tabs{display:flex;gap:22px;margin-top:14px;overflow:auto}
.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:8px 0;white-space:nowrap}
.tab.active{color:#fff;border-bottom-color:var(--accent2)}
.screen{padding:17px}
.compose{background:linear-gradient(145deg,#171927,#211a2b);border:1px solid #353047;border-radius:16px;
padding:17px;margin-bottom:16px}
.compose h2{margin:0 0 6px;font-size:18px;letter-spacing:-.2px}.compose p{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.45}
.primary{border:0;border-radius:10px;background:#9a6cf0;color:#fff;padding:12px 15px;font-weight:700;width:100%}
.primary:active{transform:translateY(1px);background:#875bdc}
.post{background:linear-gradient(145deg,var(--surface),#11131b);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}
.tag{color:#d6b8ff}.post p{font-size:15.5px;line-height:1.52;margin:11px 0 13px}
.actions{display:flex;align-items:center;gap:10px}.action{border:0;background:transparent;color:var(--muted);padding:5px 2px;font-size:13px}
.action.liked{color:var(--danger)}.pill{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:10px;color:#aeb0bc}
.section-title{margin:20px 2px 10px;font-size:13px;color:#d7d8e0;font-weight:650}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.topic{border:1px solid var(--line);background:#12141b;color:#d6d7df;border-radius:12px;padding:14px;text-align:left}
.topic small{display:block;color:var(--muted);margin-top:5px}
.empty{padding:42px 20px;text-align:center;color:var(--muted)}.empty h2{color:var(--text);margin:0 0 8px;font-size:18px}
.fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:54px;height:54px;border:0;border-radius:12px;
background:#9a6cf0;color:#fff;font-size:28px;box-shadow:0 9px 25px rgba(130,90,220,.28);z-index:8}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:66px;background:rgba(15,16,23,.96);
backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:7}
.nav{border:0;background:none;color:var(--muted);font-size:10px;min-width:62px;padding-top:8px}.nav.active{color:#fff}.nav b{display:block;font-size:18px;margin-bottom:2px;font-weight:500}
.profile-card{background:linear-gradient(145deg,#171926,#211a2b);border:1px solid #383149;border-radius:17px;padding:20px}
.profile-head{display:flex;align-items:center;gap:14px}.avatar{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,#8b62ec,#ef88bb);display:grid;place-items:center;font-size:27px}
.profile-head h2{margin:0 0 3px}.hint{color:var(--muted);font-size:12px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:#11131a;border:1px solid var(--line);border-radius:10px;padding:11px 7px;text-align:center}.stat strong{display:block;font-size:19px}.stat span{color:var(--muted);font-size:10px}
.trace{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:13px;background:#11131a}.trace strong{font-size:13px}.trace p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}
.sheet{width:min(100%,480px);margin:auto;background:#141620;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:19px;max-height:92vh;overflow:auto}
.handle{width:42px;height:4px;border-radius:4px;background:#444754;margin:0 auto 17px}.sheet h2{margin:0 0 7px}.textarea{width:100%;min-height:165px;resize:vertical;background:#0e1017;color:var(--text);
border:1px solid var(--line);border-radius:12px;padding:13px;outline:none;margin:14px 0}.textarea:focus{border-color:#7655ad}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 15px}.chip{border:1px solid var(--line);background:#11131b;color:#b8bac8;border-radius:8px;padding:8px 10px;font-size:12px}.chip.sel{border-color:#9a6cf0;color:#fff;background:#251d38}
.secondary{border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);padding:11px 15px;width:100%;margin-top:9px}
.notice{font-size:11px;color:#9fa2b2;background:#10121a;border:1px solid var(--line);padding:10px;border-radius:10px;margin-bottom:12px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,18px);opacity:0;background:#f4f3f7;color:#15151c;padding:10px 14px;border-radius:10px;font-size:12px;z-index:30;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(min-width:600px){body{padding:20px 0}.app{border-radius:25px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.35)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="header-row">
    <button class="icon-btn" id="searchBtn">⌕</button>
    <div class="brand">confess<span>.</span></div>
    <button class="icon-btn" id="infoBtn">i</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-filter="popular">Популярное</button>
    <button class="tab" data-filter="new">Свежее</button>
    <button class="tab" data-filter="mine">Мои</button>
  </div>
</header>
<main class="screen" id="screen"></main>
<button class="fab" id="fab">+</button>
<nav class="bottom">
  <button class="nav active" data-nav="feed"><b>⌂</b>Лента</button>
  <button class="nav" data-nav="topics"><b>◌</b>Темы</button>
  <button class="nav" data-nav="answers"><b>♡</b>Ответы</button>
  <button class="nav" data-nav="profile"><b>◯</b>Профиль</button>
</nav>
</div>

<div class="modal" id="modal"><div class="sheet">
<div class="handle"></div>
<h2>Скажи это анонимно</h2>
<div class="hint">Без имени. Без профиля. Просто напиши то, что давно хотелось выговорить.</div>
<textarea class="textarea" id="text" maxlength="1000" placeholder="Что ты хочешь сказать?"></textarea>
<div class="section-title">Тема</div><div class="chips" id="topics"></div>
<div class="notice">Перед публикацией текст проверяется на спам, угрозы, персональные данные и другой опасный контент.</div>
<button class="primary" id="publish">Опубликовать анонимно</button>
<button class="secondary" id="close">Отмена</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const seed=[
{id:1,tag:'Отношения',time:'2 ч назад',text:'Я до сих пор иногда захожу на его страницу. Хотя знаю, что не нужно.',likes:1240,comments:423,mine:false},
{id:2,tag:'Работа',time:'4 ч назад',text:'Я ненавижу свою работу, но боюсь признаться даже самому себе, что хочу всё поменять.',likes:891,comments:206,mine:false},
{id:3,tag:'Жизнь',time:'5 ч назад',text:'Улыбаюсь всем, но внутри очень устал(а). Кажется, никто этого не замечает.',likes:2400,comments:317,mine:false},
{id:4,tag:'Деньги',time:'7 ч назад',text:'Я говорю родителям, что всё нормально с деньгами. На самом деле я уже несколько месяцев живу от зарплаты до зарплаты.',likes:736,comments:189,mine:false},
{id:5,tag:'Друзья',time:'вчера',text:'Иногда мне хочется исчезнуть на неделю, выключить телефон и никому ничего не объяснять.',likes:1102,comments:251,mine:false}
];
let posts=JSON.parse(localStorage.getItem('confess_posts')||'null')||seed;
let likes=JSON.parse(localStorage.getItem('confess_likes')||'[]');
let filter='popular',nav='feed',selectedTopic='Жизнь';
const topics=['Отношения','Работа','Жизнь','Деньги','Психология','Семья','Друзья','Учёба','Другое'];
const screen=document.getElementById('screen'),modal=document.getElementById('modal'),text=document.getElementById('text'),toast=document.getElementById('toast');
function save(){localStorage.setItem('confess_posts',JSON.stringify(posts));localStorage.setItem('confess_likes',JSON.stringify(likes))}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':n}
function render(){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===nav));if(nav==='feed')feed();else if(nav==='topics')topicsPage();else if(nav==='answers')answers();else profile()}
function feed(){
 let list=[...posts];if(filter==='new')list.sort((a,b)=>b.id-a.id);if(filter==='mine')list=list.filter(p=>p.mine);
 screen.innerHTML=`<div class="compose"><h2>Иногда нужно просто выговориться.</h2><p>Здесь тебя никто не знает. Можешь сказать то, что не получается сказать вслух.</p><button class="primary" onclick="openModal()">+ Рассказать анонимно</button></div>`+
 (list.length?list.map(card).join(''):`<div class="empty"><h2>Пока здесь тихо</h2><div>Будь первым, кто что-то скажет.</div></div>`);
}
function card(p){let l=likes.includes(p.id);return `<article class="post"><div class="meta"><span class="tag">${esc(p.tag)}</span><span>${p.time}</span></div><p>${esc(p.text)}</p><div class="actions"><button class="action ${l?'liked':''}" onclick="like(${p.id})">${l?'♥':'♡'} ${fmt(p.likes+(l?1:0))}</button><button class="action" onclick="toastMsg('Ответы скоро появятся')">◌ ${fmt(p.comments)}</button><button class="action" onclick="toastMsg('Ссылка скопирована')">↗</button><span class="pill">анонимно</span></div></article>`}
function topicsPage(){
 screen.innerHTML=`<div class="section-title">О чём люди говорят</div><div class="topic-grid">${topics.map((t,i)=>`<button class="topic" onclick="topicFeed('${t}')">${t}<small>${[12.4,9.8,18.2,7.1,11.3,6.4,8.2,4.9,5.7][i]}K историй</small></button>`).join('')}</div>
 <div class="section-title">Популярное сейчас</div>${posts.slice(0,3).map(card).join('')}`;
}
function topicFeed(t){nav='feed';filter='popular';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter==='popular'));render();toastMsg('Тема: '+t)}
function answers(){screen.innerHTML=`<div class="section-title">Твои реакции</div><div class="post"><div class="meta"><span class="tag">Я тоже</span><span>сегодня</span></div><p>Здесь будут ответы и реакции на твои истории. Это следующий слой CONFESS.</p></div><div class="post"><div class="meta"><span class="tag">Поддержка</span><span>скоро</span></div><p>Хочется сделать ответы способом сказать другому человеку: «Ты не один такой».</p></div>`}
function profile(){
 const mine=posts.filter(p=>p.mine), reacts=mine.reduce((s,p)=>s+p.likes,0);
 screen.innerHTML=`<div class="profile-card"><div class="profile-head"><div class="avatar">🤫</div><div><h2>Аноним</h2><div class="hint">Твой профиль не раскрывает личность.</div></div></div>
 <div class="stats"><div class="stat"><strong>${mine.length}</strong><span>историй</span></div><div class="stat"><strong>${fmt(reacts)}</strong><span>«Я тоже»</span></div><div class="stat"><strong>${mine.reduce((s,p)=>s+p.comments,0)}</strong><span>ответов</span></div></div>
 <div class="trace"><strong>Твой след</strong><p>${mine.length?`Твои слова уже оставили след. Люди увидели ${fmt(reacts)} реакций «Я тоже».`:'Пока здесь пусто. Первая история появится, когда тебе захочется выговориться.'}</p></div></div>
 <div class="section-title">Мои истории</div>${mine.length?mine.map(card).join(''):`<div class="empty"><h2>Ты ещё ничего не рассказал</h2><div>Никаких обязательств. Просто помни: здесь можно.</div></div>`}`;
}
function openModal(){modal.classList.add('open');text.focus()}
function closeModal(){modal.classList.remove('open');text.value=''}
function topicChips(){document.getElementById('topics').innerHTML=topics.map(t=>`<button class="chip ${t===selectedTopic?'sel':''}" onclick="selectTopic('${t}')">${t}</button>`).join('')}
function selectTopic(t){selectedTopic=t;topicChips()}
function publish(){let v=text.value.trim();if(v.length<5){toastMsg('Напиши хотя бы несколько слов');return}posts.unshift({id:Date.now(),tag:selectedTopic,time:'только что',text:v,likes:0,comments:0,mine:true});save();closeModal();nav='feed';filter='new';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter==='new'));render();toastMsg('Опубликовано анонимно')}
function like(id){let p=posts.find(x=>x.id===id);if(!p)return;if(likes.includes(id))likes=likes.filter(x=>x!==id);else likes.push(id);save();render()}
function toastMsg(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.filter;nav='feed';render()}));
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{nav=n.dataset.nav;render()}));
document.getElementById('fab').addEventListener('click',openModal);document.getElementById('close').addEventListener('click',closeModal);document.getElementById('publish').addEventListener('click',publish);
document.getElementById('searchBtn').addEventListener('click',()=>toastMsg('Поиск добавим следующим шагом'));
document.getElementById('infoBtn').addEventListener('click',()=>toastMsg('CONFESS — анонимное место для честных мыслей'));
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
topicChips();render();
</script>
</body>
</html>
